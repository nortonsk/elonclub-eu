---
layout: default
---
{%- include rel.html %}
<article class="wrap">
  <header class="post-head">
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.t.date_format }}</time>{% if page.author %}<span>{{ page.author }}</span>{% endif %}</p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
{{ content }}
  </div>
  <p class="back"><a href="{{ rel }}{{ site.t.news_slug }}/">{{ site.t.all_news }}</a></p>
</article>
